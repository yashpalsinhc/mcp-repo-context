version: "3.8"

services:
  mcp-repo-context:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-repo-context
    restart: always
    stdin_open: true
    tty: true
    environment:
      - MCP_STORAGE_PATH=${MCP_STORAGE_PATH:-/home/mcp/data/contexts}
      - MCP_TEMP_DIR=${MCP_TEMP_DIR:-/home/mcp/tmp}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - LOG_FILE=/home/mcp/data/mcp-server.log
    volumes:
      - ${MCP_DATA_PATH:-./data}:/home/mcp/data
      - ${MCP_HOME_PATH}:/home/mcp:ro

  mcp-repo-context-http:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--mode", "http", "--listen", ":8080"]
    profiles:
      - http
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITLAB_WEBHOOK_SECRET=${GITLAB_WEBHOOK_SECRET}
    volumes:
      - repo-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: mcp-postgres
    profiles:
      - with-postgres
    environment:
      POSTGRES_DB: mcp_context
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mcppassword}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp_context"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  repo-data:
  postgres-data:
